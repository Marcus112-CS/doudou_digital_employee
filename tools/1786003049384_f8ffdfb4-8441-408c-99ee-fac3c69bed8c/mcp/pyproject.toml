[project]
name = "metadata-management-service"
version = "0.1.0"
description = "MCP Server for unified data asset metadata management: table structures, field definitions, transformation rules, and data lineage tracing."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
metadata-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
